<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koç Paneli | Pusula</title>
    <meta name="description" content="Pusula koç paneli. Profilinizi yönetin, öğrencilerinizi görüntüleyin.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .panel-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
        }

        .panel-header {
            background: rgba(0,0,0,0.15);
            padding: var(--spacing-md) 0;
        }

        .panel-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .panel-header .logo-icon {
            width: 32px;
            height: 32px;
        }

        .panel-header .logo-icon svg {
            width: 100%;
            height: 100%;
        }

        .panel-header .logo-text {
            color: var(--white);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.25rem;
        }

        .panel-header-nav {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .panel-header-nav a {
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .panel-header-nav a:hover {
            color: var(--white);
        }

        .panel-user-badge {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .panel-user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .panel-user-name {
            color: var(--white);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .panel-body {
            display: flex;
            max-width: 1100px;
            margin: var(--spacing-xl) auto;
            padding: 0 var(--spacing-lg);
            gap: var(--spacing-xl);
        }

        .panel-sidebar {
            width: 260px;
            flex-shrink: 0;
        }

        .sidebar-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .sidebar-user {
            padding: var(--spacing-xl);
            text-align: center;
            border-bottom: 1px solid var(--gray-200);
        }

        .sidebar-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.5rem;
            margin: 0 auto var(--spacing-md);
        }

        .sidebar-user h3 {
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 4px;
        }

        .sidebar-user p {
            font-size: 0.85rem;
            color: var(--gray-500);
        }

        .coach-role-badge {
            display: inline-block;
            margin-top: var(--spacing-sm);
            padding: 3px 12px;
            background: var(--primary);
            color: var(--white);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .sidebar-menu {
            padding: var(--spacing-sm) 0;
        }

        .sidebar-menu-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-xl);
            color: var(--gray-600);
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: var(--font-primary);
        }

        .sidebar-menu-item:hover {
            background: var(--gray-100);
            color: var(--primary);
        }

        .sidebar-menu-item.active {
            background: rgba(30, 58, 95, 0.08);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-menu-item svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .sidebar-logout {
            border-top: 1px solid var(--gray-200);
        }

        .sidebar-logout .sidebar-menu-item {
            color: var(--accent);
        }

        .sidebar-logout .sidebar-menu-item:hover {
            background: rgba(230, 57, 70, 0.06);
        }

        .panel-content {
            flex: 1;
            min-width: 0;
        }

        .content-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--spacing-xxl);
        }

        .content-title {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: var(--spacing-sm);
        }

        .content-subtitle {
            color: var(--gray-500);
            margin-bottom: var(--spacing-xl);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        .info-item {
            padding: var(--spacing-lg);
            background: var(--gray-100);
            border-radius: var(--radius-lg);
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.05rem;
            color: var(--gray-800);
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xxl) var(--spacing-xl);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            color: var(--gray-400);
            margin-bottom: var(--spacing-lg);
        }

        .empty-state h3 {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            color: var(--gray-700);
            margin-bottom: var(--spacing-sm);
        }

        .empty-state p {
            color: var(--gray-500);
            margin-bottom: var(--spacing-lg);
        }

        .students-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .student-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: var(--gray-100);
            border-radius: var(--radius-lg);
        }

        .student-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .student-info {
            flex: 1;
            min-width: 0;
        }

        .student-info h3 {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: 2px;
        }

        .student-info p {
            color: var(--gray-500);
            font-size: 0.85rem;
        }

        .student-details {
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
        }

        .student-detail {
            background: var(--white);
            border-radius: var(--radius-md);
            padding: 6px 14px;
            font-size: 0.8rem;
            color: var(--gray-600);
            font-weight: 500;
        }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .settings-section {
            padding-bottom: var(--spacing-xl);
            border-bottom: 1px solid var(--gray-200);
        }

        .settings-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .settings-section h3 {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-800);
            margin-bottom: var(--spacing-lg);
        }

        .form-group {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: var(--spacing-sm);
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: var(--spacing-md);
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-md);
            font-family: var(--font-primary);
            font-size: 1rem;
            transition: var(--transition);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: var(--spacing-md) var(--spacing-xl);
            background: var(--success);
            color: var(--white);
            border-radius: var(--radius-lg);
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .section-hidden {
            display: none;
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            padding: 8px;
        }

        .mobile-menu-toggle svg {
            width: 24px;
            height: 24px;
        }

        @media (max-width: 768px) {
            .panel-body {
                flex-direction: column;
            }

            .panel-sidebar {
                width: 100%;
            }

            .sidebar-card {
                display: flex;
                border-radius: var(--radius-xl);
                overflow: visible;
            }

            .sidebar-user {
                display: none;
            }

            .sidebar-menu {
                display: flex;
                padding: var(--spacing-sm);
                gap: 4px;
                overflow-x: auto;
                flex: 1;
            }

            .sidebar-menu-item {
                padding: var(--spacing-sm) var(--spacing-md);
                font-size: 0.85rem;
                white-space: nowrap;
                border-radius: var(--radius-md);
            }

            .sidebar-logout {
                border-top: none;
                border-left: 1px solid var(--gray-200);
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .panel-header-nav {
                display: none;
            }

            .mobile-menu-toggle {
                display: block;
            }

            .content-card {
                padding: var(--spacing-xl);
            }

            .student-item {
                flex-wrap: wrap;
            }

            .student-details {
                margin-top: var(--spacing-sm);
            }
        }
    </style>
</head>
<body>
    <div class="panel-page">
        <header class="panel-header">
            <div class="container">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>

                <nav class="panel-header-nav">
                    <a href="../index.html">Ana Sayfa</a>
                    <a href="koclar.html">Koçlarımız</a>
                    <a href="paketler.html">Paketler</a>
                    <a href="iletisim.html">İletişim</a>
                </nav>

                <div class="panel-user-badge">
                    <div class="panel-user-avatar" id="headerAvatar"></div>
                    <span class="panel-user-name" id="headerName"></span>
                </div>

                <button class="mobile-menu-toggle" onclick="document.querySelector('.sidebar-card').classList.toggle('mobile-open')" aria-label="Menüyü aç">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
        </header>

        <div class="panel-body">
            <aside class="panel-sidebar">
                <div class="sidebar-card">
                    <div class="sidebar-user">
                        <div class="sidebar-avatar" id="sidebarAvatar"></div>
                        <h3 id="sidebarName"></h3>
                        <p id="sidebarEmail"></p>
                        <span class="coach-role-badge">Koç</span>
                    </div>

                    <div class="sidebar-menu">
                        <button class="sidebar-menu-item active" data-section="profilim" onclick="showSection('profilim')">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            Profilim
                        </button>
                        <button class="sidebar-menu-item" data-section="ogrenciler" onclick="showSection('ogrenciler')">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
                            Öğrencilerim
                        </button>
                        <button class="sidebar-menu-item" data-section="ayarlar" onclick="showSection('ayarlar')">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                            Ayarlar
                        </button>
                    </div>

                    <div class="sidebar-logout">
                        <a href="admin.html" class="sidebar-menu-item" id="adminLink" style="display:none; text-decoration:none;">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                            Admin Paneli
                        </a>
                        <button class="sidebar-menu-item" onclick="logoutUser()">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                            Çıkış Yap
                        </button>
                    </div>
                </div>
            </aside>

            <main class="panel-content">
                <!-- Profilim -->
                <section class="content-card section-content" id="section-profilim">
                    <h2 class="content-title">Profilim</h2>
                    <p class="content-subtitle">Koç bilgileriniz</p>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">Ad Soyad</div>
                            <div class="info-value" id="infoName"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">E-posta</div>
                            <div class="info-value" id="infoEmail"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Uzmanlık</div>
                            <div class="info-value" id="infoSpecialty"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Deneyim</div>
                            <div class="info-value" id="infoExperience"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Telefon</div>
                            <div class="info-value" id="infoPhone"></div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Öğrenci Sayısı</div>
                            <div class="info-value" id="infoStudents"></div>
                        </div>
                    </div>
                    <div style="margin-top: var(--spacing-lg);">
                        <button class="btn btn-primary" onclick="showSection('ogrenciler')">Öğrencilerimi Görüntüle</button>
                    </div>
                </section>

                <!-- Öğrencilerim -->
                <section class="content-card section-content section-hidden" id="section-ogrenciler">
                    <h2 class="content-title">Öğrencilerim</h2>
                    <p class="content-subtitle">Size atanmış öğrenciler</p>
                    <div id="studentsContent"></div>
                </section>

                <!-- Ayarlar -->
                <section class="content-card section-content section-hidden" id="section-ayarlar">
                    <h2 class="content-title">Ayarlar</h2>
                    <p class="content-subtitle">Şifrenizi değiştirin</p>
                    <div class="settings-form">
                        <div class="settings-section">
                            <h3>Şifre Değiştir</h3>
                            <form id="passwordForm">
                                <div class="form-group">
                                    <label>Yeni Şifre</label>
                                    <input type="password" id="newPassword" placeholder="En az 6 karakter">
                                </div>
                                <div style="margin-top: var(--spacing-lg);">
                                    <button type="submit" class="btn btn-primary">Şifreyi Güncelle</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { requireAuth, logoutUser } from '../src/lib/auth.js';
        import { getProfile, getCoachByEmail, getCoachStudents } from '../src/lib/db.js';

        var currentUser = null;
        var currentProfile = null;
        var currentCoach = null;

        async function init() {
            var session = await requireAuth();
            if (!session) return;

            currentUser = session.user;
            try {
                currentProfile = await getProfile(currentUser.id);
            } catch (e) {
                window.location.replace('giris.html');
                return;
            }
            if (!currentProfile || currentProfile.role !== 'coach') {
                window.location.replace('giris.html');
                return;
            }

            currentCoach = await getCoachByEmail(currentUser.email);
            initPanel();
            loadStudents();

            if (currentProfile.role === 'admin') {
                document.getElementById('adminLink').style.display = 'flex';
            }
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(function(n) { return n[0]; }).join('').toUpperCase().substring(0, 2);
        }

        function initPanel() {
            var userName = currentProfile.full_name || 'Koç';
            var userEmail = currentUser.email || '';
            var initials = getInitials(userName);

            document.getElementById('headerAvatar').textContent = initials;
            document.getElementById('headerName').textContent = userName;
            document.getElementById('sidebarAvatar').textContent = initials;
            document.getElementById('sidebarName').textContent = userName;
            document.getElementById('sidebarEmail').textContent = userEmail;

            document.getElementById('infoName').textContent = userName;
            document.getElementById('infoEmail').textContent = userEmail;
            document.getElementById('infoSpecialty').textContent = (currentCoach && currentCoach.specialty) || 'Belirtilmemiş';
            document.getElementById('infoExperience').textContent = (currentCoach && currentCoach.experience) || 'Belirtilmemiş';
            document.getElementById('infoPhone').textContent = (currentCoach && currentCoach.phone) || currentProfile.phone || 'Belirtilmemiş';
            document.getElementById('infoStudents').textContent = (currentCoach && currentCoach.students_count != null) ? currentCoach.students_count + ' öğrenci' : 'Belirtilmemiş';
        }

        window.showSection = function(section) {
            document.querySelectorAll('.section-content').forEach(function(el) {
                el.classList.add('section-hidden');
            });
            document.getElementById('section-' + section).classList.remove('section-hidden');

            document.querySelectorAll('.sidebar-menu-item[data-section]').forEach(function(el) {
                el.classList.remove('active');
            });
            document.querySelector('[data-section="' + section + '"]').classList.add('active');
        };

        async function loadStudents() {
            var container = document.getElementById('studentsContent');
            try {
                var assignments = await getCoachStudents();
                if (assignments.length === 0) {
                    container.innerHTML =
                        '<div class="empty-state">' +
                            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>' +
                            '<h3>Henüz atanmış öğrenciniz yok</h3>' +
                            '<p>Öğrenci atamaları admin paneli üzerinden yapıldığında burada görünecek.</p>' +
                        '</div>';
                    return;
                }

                var html = '<div class="students-list">';
                assignments.forEach(function(assignment) {
                    var student = assignment.profiles;
                    if (!student) return;
                    var stu = student[0] || student;
                    if (!stu) return;
                    var initials = getInitials(stu.full_name);
                    var grade = stu.grade ? stu.grade + '. Sınıf' : '';
                    html +=
                        '<div class="student-item">' +
                            '<div class="student-avatar">' + initials + '</div>' +
                            '<div class="student-info">' +
                                '<h3>' + escapeHtml(stu.full_name || 'Öğrenci') + '</h3>' +
                                '<p>' + escapeHtml(stu.email || '') + '</p>' +
                            '</div>' +
                            '<div class="student-details">' +
                                (grade ? '<span class="student-detail">' + escapeHtml(grade) + '</span>' : '') +
                                (stu.phone ? '<span class="student-detail">' + escapeHtml(stu.phone) + '</span>' : '') +
                            '</div>' +
                        '</div>';
                });
                html += '</div>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="empty-state"><p>Yüklenirken hata oluştu.</p></div>';
            }
        }

        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var newPass = document.getElementById('newPassword').value;

            if (!newPass) {
                showToast('Lütfen yeni şifrenizi girin.', 'error');
                return;
            }
            if (newPass.length < 6) {
                showToast('Yeni şifre en az 6 karakter olmalıdır.', 'error');
                return;
            }

            try {
                const { supabase } = await import('../src/lib/supabase.js');
                var { error } = await supabase.auth.updateUser({ password: newPass });
                if (error) throw error;
                document.getElementById('newPassword').value = '';
                showToast('Şifreniz güncellendi.');
            } catch (err) {
                showToast('Şifre güncellenirken hata oluştu: ' + err.message, 'error');
            }
        });

        window.logoutUser = async function() {
            try {
                await logoutUser();
                window.location.replace('../index.html');
            } catch (e) {
                window.location.replace('../index.html');
            }
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.background = type === 'error' ? 'var(--accent)' : 'var(--success)';
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }

        init();
    </script>
</body>
</html>
