<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre | Pusula</title>
    <meta name="description" content="Yeni şifrenizi belirleyin.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
        
        <div class="back-home">
            <a href="../index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>
            </div>
            
            <div class="auth-card">
                <div id="resetForm">
                    <h1 class="auth-title">Yeni Şifre Belirle</h1>
                    <p class="auth-subtitle">Hesabınız için yeni bir şifre oluşturun</p>
                    
                    <div class="form-error" id="resetError" style="display: none; margin-bottom: 16px; padding: 12px; background: #fff5f5; border-radius: 8px; text-align: center;"></div>
                    
                    <form id="newPasswordForm">
                        <div class="form-group">
                            <label class="form-label">Yeni Şifre</label>
                            <input type="password" class="form-input" id="newPassword" placeholder="En az 6 karakter" required oninput="this.classList.remove('error'); document.getElementById('passwordError').style.display='none'; document.getElementById('resetError').style.display='none';">
                            <div class="form-error" id="passwordError" style="display: none;">Şifre en az 6 karakter olmalıdır</div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Yeni Şifre (Tekrar)</label>
                            <input type="password" class="form-input" id="newPasswordConfirm" placeholder="Tekrar girin" required oninput="this.classList.remove('error'); document.getElementById('confirmError').style.display='none'; document.getElementById('resetError').style.display='none';">
                            <div class="form-error" id="confirmError" style="display: none;">Şifreler eşleşmiyor</div>
                        </div>
                        
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAA" data-theme="light" style="margin: 16px 0;"></div>
                        
                        <button type="submit" class="btn btn-primary" id="saveBtn" style="width: 100%;">
                            <span>Şifreyi Güncelle</span>
                        </button>
                    </form>
                    
                    <p class="auth-footer">
                        <a href="giris.html">← Giriş sayfasına dön</a>
                    </p>
                </div>
                
                <div id="successMessage" class="success-message" style="display: none;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="#2a9d8f" style="margin-bottom: 16px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <h2>Şifreniz Güncellendi!</h2>
                    <p>Yeni şifreniz başarıyla kaydedildi. Giriş sayfasına yönlendiriliyorsunuz.</p>
                    <a href="giris.html" class="btn btn-primary" style="width: 100%;">
                        Giriş Yap
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { updateUserPassword, getCurrentSession } from '../src/lib/auth.js';
        import { isTurnstileEnabled, initTurnstileWidgets, loadTurnstileScript } from '../src/lib/turnstile.js';

        await loadTurnstileScript();
        initTurnstileWidgets();

        var resetError = document.getElementById('resetError');

        function showError(msg) {
            resetError.textContent = msg;
            resetError.style.display = 'block';
        }

        (async function() {
            var session = await getCurrentSession();
            if (!session) {
                document.getElementById('resetForm').style.display = 'none';
                showError('Bağlantı geçersiz veya süresi dolmuş. Lütfen tekrar şifre sıfırlama talebinde bulunun.');
            }
        })();

        document.getElementById('newPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var newPassword = document.getElementById('newPassword');
            var newPasswordConfirm = document.getElementById('newPasswordConfirm');
            var passwordError = document.getElementById('passwordError');
            var confirmError = document.getElementById('confirmError');
            var saveBtn = document.getElementById('saveBtn');

            newPassword.classList.remove('error');
            newPasswordConfirm.classList.remove('error');
            passwordError.style.display = 'none';
            confirmError.style.display = 'none';
            resetError.style.display = 'none';

            var valid = true;

            if (newPassword.value.length < 6) {
                newPassword.classList.add('error');
                passwordError.style.display = 'block';
                valid = false;
            }

            if (newPasswordConfirm.value !== newPassword.value || newPasswordConfirm.value.length === 0) {
                newPasswordConfirm.classList.add('error');
                confirmError.style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            if (isTurnstileEnabled()) {
                var turnstileToken = document.querySelector('#newPasswordForm [name="cf-turnstile-response"]');
                if (!turnstileToken || !turnstileToken.value) {
                    showError('Lütfen robot olmadığını doğrulayın.');
                    return;
                }
            }

            saveBtn.classList.add('btn-loading');
            saveBtn.disabled = true;

            try {
                await updateUserPassword(newPassword.value);

                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                setTimeout(function() {
                    window.location.replace('giris.html');
                }, 2500);

            } catch (err) {
                saveBtn.classList.remove('btn-loading');
                saveBtn.disabled = false;

                if (err.message && err.message.toLowerCase().indexOf('session') !== -1) {
                    showError('Oturum bulunamadı. Lütfen şifre sıfırlama bağlantısını tekrar talep edin.');
                } else {
                    showError('Bir hata oluştu: ' + (err.message || 'Lütfen daha sonra tekrar deneyin.'));
                }
            }
        });
    </script>
</body>
</html>
