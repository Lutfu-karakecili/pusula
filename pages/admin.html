<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Girişi | Pusula</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-page {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230, 57, 70, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(230, 57, 70, 0.3);
        }
        
        .admin-badge svg {
            width: 18px;
            height: 18px;
            fill: var(--accent);
        }
        
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
        }
        
        .error-message {
            background: #fff5f5;
            border: 1px solid #e63946;
            color: #e63946;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
            text-align: center;
            animation: shake 0.3s ease;
        }
        
        .error-message.show {
            display: block;
        }
        
        .security-notice {
            margin-top: 24px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--gray-600);
            text-align: center;
        }
        
        .security-notice svg {
            width: 14px;
            height: 14px;
            fill: var(--gray-500);
            vertical-align: middle;
            margin-right: 4px;
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>
            </div>
            
            <div class="auth-card">
                <div class="admin-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                    Admin Paneli
                </div>
                
                <h1 class="auth-title">Yönetim Paneli</h1>
                <p class="auth-subtitle">Yönetim arayüzüne erişmek için giriş yapın</p>
                
                <div class="error-message" id="errorMessage"></div>
                
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label class="form-label">E-posta Adresiniz</label>
                        <input type="email" class="form-input" id="adminEmail" placeholder="admin@pusula.com" required oninput="this.classList.remove('error'); document.getElementById('errorMessage').classList.remove('show');">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Şifreniz</label>
                        <input type="password" class="form-input" id="adminPassword" placeholder="••••••••" required oninput="this.classList.remove('error'); document.getElementById('errorMessage').classList.remove('show');">
                    </div>
                    
                    <div class="form-options">
                        <div class="form-checkbox">
                            <input type="checkbox" id="remember">
                            <label for="remember">Beni hatırla</label>
                        </div>
                        <a href="sifre-sifirlama.html" class="form-forgot">Şifremi Unuttum</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" id="adminLoginBtn" style="width: 100%;">
                        <span>Giriş Yap</span>
                    </button>
                </form>
                
                <div class="security-notice">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                    Bu alan sadece yetkili adminler için erişilebilirdir.
                </div>
                
                <p class="auth-footer">
                    <a href="../index.html">← Ana sayfaya dön</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, getCurrentSession, getCurrentProfile } from '../src/lib/auth.js';

        // Eğer zaten giriş yapılmışsa ve adminse dashboard'a yönlendir
        const existingSession = await getCurrentSession();
        if (existingSession) {
            try {
                const profile = await getCurrentProfile();
                if (profile && profile.role === 'admin') {
                    window.location.replace('admin-dashboard.html');
                }
            } catch (e) {
                // Profil alınamadı, devam et
            }
        }

        document.getElementById('adminLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('adminEmail');
            var password = document.getElementById('adminPassword');
            var errorMessage = document.getElementById('errorMessage');
            var loginBtn = document.getElementById('adminLoginBtn');
            
            // Clear errors
            email.classList.remove('error');
            password.classList.remove('error');
            errorMessage.classList.remove('show');
            
            // Validation
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                email.classList.add('error');
                errorMessage.textContent = 'Geçerli bir e-posta adresi giriniz.';
                errorMessage.classList.add('show');
                return;
            }
            
            if (password.value.length < 6) {
                password.classList.add('error');
                errorMessage.textContent = 'Şifre en az 6 karakter olmalıdır.';
                errorMessage.classList.add('show');
                return;
            }
            
            // Loading state
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;
            
            try {
                // Supabase ile giriş yap
                await loginUser({ email: email.value, password: password.value });
                
                // Profili kontrol et
                const profile = await getCurrentProfile();
                
                if (!profile || profile.role !== 'admin') {
                    // Admin değilse
                    loginBtn.classList.remove('btn-loading');
                    loginBtn.disabled = false;
                    
                    errorMessage.textContent = 'Bu alan sadece adminler için erişilebilir. Yetkiniz bulunmuyor.';
                    errorMessage.classList.add('show');
                    password.value = '';
                    
                    // Oturumu kapat (admin değilse giriş yapmasın)
                    const { logoutUser } = await import('../src/lib/auth.js');
                    await logoutUser();
                    
                    return;
                }
                
                // Admin girişi başarılı
                window.location.replace('admin-dashboard.html');
                
            } catch (err) {
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
                
                errorMessage.textContent = 'E-posta veya şifre hatalı.';
                errorMessage.classList.add('show');
                password.value = '';
            }
        });
    </script>
</body>
</html>
