<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Pusula</title>
    <meta name="description" content="Sayfa bulunamadı.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            text-align: center;
            padding: 20px;
        }
        .error-container { max-width: 500px; }
        .error-code {
            font-family: var(--font-heading);
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 16px;
            text-shadow: 0 4px 20px rgba(230,57,70,0.3);
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 12px;
        }
        .error-text {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .error-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .error-icon svg { width: 60px; height: 60px; fill: var(--accent-light); }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">Sayfa Bulunamadı</h1>
            <p class="error-text">Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.</p>
            <div class="error-buttons">
                <a href="../index.html" class="btn btn-primary">Ana Sayfaya Dön</a>
                <a href="javascript:history.back()" class="btn btn-outline">Geri Dön</a>
            </div>
        </div>
    </div>
</body>
</html>
