<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | Pusula</title>
    <meta name="description" content="Pusula'ya ücretsiz kayıt olun. YKS hazırlığında fark yaratın.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
        
        <div class="back-home">
            <a href="../index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>
            </div>
            
            <div class="auth-card">
                <h1 class="auth-title">Kayıt Ol</h1>
                <p class="auth-subtitle">Pusula'ya katılın, hedefinize ulaşın</p>
                
                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Adınız</label>
                            <input type="text" class="form-input" id="regName" placeholder="Adınız" required oninput="clearError('regName')">
                            <div class="form-error" id="regName-error"></div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Soyadınız</label>
                            <input type="text" class="form-input" id="regSurname" placeholder="Soyadınız" required oninput="clearError('regSurname')">
                            <div class="form-error" id="regSurname-error"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">E-posta Adresiniz</label>
                        <input type="email" class="form-input" id="regEmail" placeholder="ornek@email.com" required oninput="clearError('regEmail')">
                        <div class="form-error" id="regEmail-error"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Telefon Numaranız</label>
                        <input type="tel" class="form-input" id="regPhone" placeholder="05XX XXX XX XX" required oninput="clearError('regPhone')">
                        <div class="form-error" id="regPhone-error"></div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Şifreniz</label>
                            <input type="password" class="form-input" id="regPassword" placeholder="••••••••" required oninput="clearError('regPassword'); checkPasswordStrength(this.value)">
                            <div class="form-error" id="regPassword-error"></div>
                            <div class="password-strength" id="passwordStrength" style="display: none;">
                                <div class="password-strength-bar"></div>
                                <div class="password-strength-bar"></div>
                                <div class="password-strength-bar"></div>
                                <div class="password-strength-bar"></div>
                            </div>
                            <div class="password-strength-text" id="passwordStrengthText"></div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">Şifre Tekrar</label>
                            <input type="password" class="form-input" id="regPasswordConfirm" placeholder="••••••••" required oninput="clearError('regPasswordConfirm')">
                            <div class="form-error" id="regPasswordConfirm-error"></div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Sınıfınız</label>
                        <select class="form-select" id="regGrade" required oninput="clearError('regGrade')">
                            <option value="">Seçiniz</option>
                            <option value="11">11. Sınıf</option>
                            <option value="12">12. Sınıf</option>
                            <option value="mezun">Mezun</option>
                        </select>
                        <div class="form-error" id="regGrade-error"></div>
                    </div>
                    
                    <div class="form-checkbox">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            <a href="kullanim-sartlari.html">Kullanım Şartları</a>'nı ve <a href="gizlilik-politikasi.html">Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
                        </label>
                    </div>

                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAA" data-theme="light" style="margin: 16px 0;"></div>
                    
                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        <span>Kayıt Ol</span>
                    </button>
                </form>
                
                <p class="auth-footer">
                    Zaten hesabınız var mı? <a href="giris.html">Giriş Yap</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { registerUser } from '../src/lib/auth.js';
        import { isTurnstileEnabled, initTurnstileWidgets } from '../src/lib/turnstile.js';
        initTurnstileWidgets();

        function showError(fieldId, message) {
            var input = document.getElementById(fieldId);
            var errorDiv = document.getElementById(fieldId + '-error');
            if (input) {
                input.classList.add('error');
            }
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        function clearError(fieldId) {
            var input = document.getElementById(fieldId);
            var errorDiv = document.getElementById(fieldId + '-error');
            if (input) {
                input.classList.remove('error');
            }
            if (errorDiv) {
                errorDiv.textContent = '';
                errorDiv.style.display = 'none';
            }
        }

        function clearAllErrors() {
            var ids = ['regName', 'regSurname', 'regEmail', 'regPhone', 'regPassword', 'regPasswordConfirm', 'regGrade'];
            for (var i = 0; i < ids.length; i++) {
                clearError(ids[i]);
            }
        }

        function checkPasswordStrength(password) {
            var strengthContainer = document.getElementById('passwordStrength');
            var strengthText = document.getElementById('passwordStrengthText');
            var bars = strengthContainer.querySelectorAll('.password-strength-bar');
            
            if (!password) {
                strengthContainer.style.display = 'none';
                strengthText.textContent = '';
                return;
            }
            
            strengthContainer.style.display = 'flex';
            
            var strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            var level = '';
            var text = '';
            
            if (strength <= 1) {
                level = 'weak';
                text = 'Zayıf';
            } else if (strength <= 3) {
                level = 'medium';
                text = 'Orta';
            } else {
                level = 'strong';
                text = 'Güçlü';
            }
            
            bars.forEach(function(bar, index) {
                bar.className = 'password-strength-bar';
                if (index < strength) {
                    bar.classList.add(level);
                }
            });
            
            strengthText.textContent = 'Şifre gücü: ' + text;
        }

        // Make checkPasswordStrength available globally
        window.checkPasswordStrength = checkPasswordStrength;

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAllErrors();

            var name = document.getElementById('regName').value.trim();
            var surname = document.getElementById('regSurname').value.trim();
            var email = document.getElementById('regEmail').value.trim();
            var phone = document.getElementById('regPhone').value.trim();
            var password = document.getElementById('regPassword').value;
            var passwordConfirm = document.getElementById('regPasswordConfirm').value;
            var grade = document.getElementById('regGrade').value;
            var registerBtn = document.getElementById('registerBtn');

            var hasError = false;

            if (name.length < 2) {
                showError('regName', 'Ad en az 2 karakter olmalıdır.');
                hasError = true;
            }

            if (surname.length < 2) {
                showError('regSurname', 'Soyad en az 2 karakter olmalıdır.');
                hasError = true;
            }

            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('regEmail', 'Geçerli bir e-posta adresi giriniz.');
                hasError = true;
            }

            if (phone.length > 0) {
                var digitsOnly = phone.replace(/\D/g, '');
                if (digitsOnly.length < 10) {
                    showError('regPhone', 'Telefon numarası en az 10 haneli olmalıdır.');
                    hasError = true;
                }
            } else {
                showError('regPhone', 'Telefon numarası gereklidir.');
                hasError = true;
            }

            if (password.length < 6) {
                showError('regPassword', 'Şifre en az 6 karakter olmalıdır.');
                hasError = true;
            }

            if (passwordConfirm !== password) {
                showError('regPasswordConfirm', 'Şifreler eşleşmiyor.');
                hasError = true;
            }

            if (!document.getElementById('terms').checked) {
                showError('regPasswordConfirm', 'Kullanım şartlarını kabul etmelisiniz.');
                hasError = true;
            }

            var turnstileToken = { value: 'disabled' };
            if (isTurnstileEnabled()) {
                var _t = document.querySelector('#registerForm [name="cf-turnstile-response"]');
                if (!_t || !_t.value) {
                    showError('regEmail', 'Lütfen robot olmadığını doğrulayın.');
                    hasError = true;
                } else {
                    turnstileToken.value = _t.value;
                }
            }

            if (hasError) {
                return;
            }

            // Loading state
            registerBtn.classList.add('btn-loading');
            registerBtn.disabled = true;

            try {
                await registerUser({
                    fullName: name + ' ' + surname,
                    email: email,
                    phone: phone,
                    password: password,
                    grade: grade,
                    turnstileToken: turnstileToken.value
                });

                var card = document.querySelector('.auth-card');
                card.innerHTML = '<div class="success-message"><svg width="64" height="64" viewBox="0 0 24 24" fill="#2a9d8f" style="margin-bottom: 16px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg><h2>Kayıt başarılı!</h2><p>E-posta adresinize doğrulama linki gönderildi. Lütfen gelen kutunuzu kontrol edin.</p></div>';

                setTimeout(function() {
                    window.location.replace('giris.html');
                }, 3000);

            } catch (err) {
                registerBtn.classList.remove('btn-loading');
                registerBtn.disabled = false;
                
                if (err.message && err.message.toLowerCase().indexOf('already registered') !== -1) {
                    showError('regEmail', 'Bu e-posta adresi zaten kayıtlı!');
                } else if (err.message && err.message.toLowerCase().indexOf('password') !== -1) {
                    showError('regPassword', 'Şifre gereksinimlerini karşılamıyor: ' + err.message);
                } else {
                    showError('regEmail', 'Kayıt sırasında bir hata oluştu: ' + (err.message || 'Bilinmeyen hata'));
                }
            }
        });
    </script>
</body>
</html>
