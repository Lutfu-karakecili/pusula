<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap | Pusula</title>
    <meta name="description" content="Pusula hesabınıza giriş yapın.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
        
        <div class="back-home">
            <a href="../index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>
            </div>
            
            <div class="auth-card">
                <h1 class="auth-title">Giriş Yap</h1>
                <p class="auth-subtitle">Hesabınıza erişmek için bilgilerinizi girin</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">E-posta Adresiniz</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="ornek@email.com" required oninput="this.classList.remove('error'); document.getElementById('emailError').style.display='none';">
                        <div class="form-error" id="emailError">Geçerli bir e-posta adresi girin</div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Şifreniz</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required oninput="this.classList.remove('error'); document.getElementById('passwordError').style.display='none';">
                        <div class="form-error" id="passwordError">Şifre en az 6 karakter olmalıdır</div>
                    </div>
                    
                    <div class="form-options">
                        <div class="form-checkbox">
                            <input type="checkbox" id="remember">
                            <label for="remember">Beni hatırla</label>
                        </div>
                        <a href="sifre-sifirlama.html" class="form-forgot">Şifremi Unuttum</a>
                    </div>
                    
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAA" data-theme="light" style="margin: 16px 0;"></div>
                    
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span>Giriş Yap</span>
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>veya</span>
                </div>
                
                <a href="#" class="btn btn-secondary" style="width: 100%; opacity: 0.6; cursor: not-allowed;">
                    Google ile Giriş Yap (Yakında)
                </a>
                
                <p class="auth-footer">
                    Hesabınız yok mu? <a href="kayit.html">Kayıt Ol</a>
                </p>
            </div>
        </div>
    </div>

    <script type="module">
        import { loginUser, getCurrentSession } from '../src/lib/auth.js';

        (async function() {
            const existingSession = await getCurrentSession();
            if (existingSession) {
                window.location.replace('index.html');
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('loginEmail');
            var password = document.getElementById('loginPassword');
            var emailError = document.getElementById('emailError');
            var passwordError = document.getElementById('passwordError');
            var loginBtn = document.getElementById('loginBtn');
            var valid = true;
            
            // Clear previous errors
            email.classList.remove('error');
            password.classList.remove('error');
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email.value)) {
                email.classList.add('error');
                emailError.style.display = 'block';
                valid = false;
            }
            
            if (password.value.length < 6) {
                password.classList.add('error');
                passwordError.style.display = 'block';
                valid = false;
            }
            
            if (!valid) return;

            var turnstileToken = document.querySelector('#loginForm [name="cf-turnstile-response"]');
            if (!turnstileToken || !turnstileToken.value) {
                emailError.textContent = 'Lütfen robot olmadığını doğrulayın.';
                email.classList.add('error');
                emailError.style.display = 'block';
                return;
            }

            // Loading state
            loginBtn.classList.add('btn-loading');
            loginBtn.disabled = true;

            try {
                await loginUser({ email: email.value, password: password.value });
                window.location.replace('index.html');
            } catch (err) {
                loginBtn.classList.remove('btn-loading');
                loginBtn.disabled = false;
                
                emailError.textContent = 'E-posta veya şifre hatalı.';
                email.classList.add('error');
                emailError.style.display = 'block';
                password.value = '';
                password.classList.remove('error');
                passwordError.style.display = 'none';
            }
        });
    </script>
</body>
</html>
