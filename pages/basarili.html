<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Başarılı | Pusula</title>
    <meta name="description" content="İşleminiz başarıyla tamamlandı.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="../public/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            text-align: center;
            padding: 20px;
        }
        .success-container { max-width: 500px; }
        .success-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: rgba(45, 106, 79, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: successPop 0.6s ease;
        }
        .success-icon svg { width: 60px; height: 60px; fill: #2d6a4f; }
        @keyframes successPop {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .success-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 16px;
        }
        .success-text {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .success-details {
            background: rgba(255,255,255,0.1);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            text-align: left;
        }
        .success-details h3 {
            color: var(--white);
            font-family: var(--font-heading);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .success-details ul {
            list-style: none;
            padding: 0;
        }
        .success-details li {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .success-details li::before {
            content: '✓';
            color: #2d6a4f;
            font-weight: 700;
            background: rgba(45,106,79,0.3);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="success-page">
        <div class="success-container">
            <div class="success-icon">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </div>
            <h1 class="success-title">Kayıt Başarılı!</h1>
            <p class="success-text">Pusula ailesine hoş geldiniz! Hesabınız başarıyla oluşturuldu.</p>
            
            <div class="success-details">
                <h3>Yapmanız gerekenler:</h3>
                <ul>
                    <li>E-posta adresinize doğrulama linki gönderildi</li>
                    <li>Koçunuz sizinle en kısa sürede iletişime geçecek</li>
                    <li>Giriş yaparak panele erişebilirsiniz</li>
                </ul>
            </div>
            
            <div class="error-buttons">
                <a href="giris.html" class="btn btn-primary">Giriş Yap</a>
                <a href="../index.html" class="btn btn-outline">Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>
</body>
</html>
