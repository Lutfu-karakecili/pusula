<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama | Pusula</title>
    <meta name="description" content="Şifrenizi sıfırlayın.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-shapes">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
        
        <div class="back-home">
            <a href="../index.html">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Ana Sayfaya Dön
            </a>
        </div>
        
        <div class="auth-container">
            <div class="auth-logo">
                <a href="../index.html" class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Pusula</span>
                </a>
            </div>
            
            <div class="auth-card">
                <div id="resetForm">
                    <h1 class="auth-title">Şifre Sıfırlama</h1>
                    <p class="auth-subtitle">E-posta adresinizi girin, size sıfırlama bağlantısı gönderelim</p>
                    
                    <div class="form-error" id="resetError" style="display: none; margin-bottom: 16px; padding: 12px; background: #fff5f5; border-radius: 8px; text-align: center;"></div>
                    
                    <form id="passwordResetForm">
                        <div class="form-group">
                            <label class="form-label">E-posta Adresiniz</label>
                            <input type="email" class="form-input" id="resetEmail" placeholder="ornek@email.com" required oninput="this.classList.remove('error'); document.getElementById('resetError').style.display='none';">
                        </div>
                        
                        <div class="cf-turnstile" data-sitekey="0x4AAAAAAA" data-theme="light" style="margin: 16px 0;"></div>
                        
                        <button type="submit" class="btn btn-primary" id="resetBtn" style="width: 100%;">
                            <span>Sıfırlama Bağlantısı Gönder</span>
                        </button>
                    </form>
                    
                    <p class="auth-footer">
                        <a href="giris.html">← Giriş sayfasına dön</a>
                    </p>
                </div>
                
                <div id="successMessage" class="success-message">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="#2a9d8f" style="margin-bottom: 16px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <h2>Bağlantı Gönderildi!</h2>
                    <p>E-posta adresinize şifre sıfırlama bağlantısı gönderdik. Lütfen gelen kutunuzu (ve spam klasörünü) kontrol edin.</p>
                    <a href="giris.html" class="btn btn-primary" style="width: 100%;">
                        Giriş Sayfasına Dön
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { sendPasswordReset } from '../src/lib/auth.js';
        import { isTurnstileEnabled, initTurnstileWidgets } from '../src/lib/turnstile.js';
        initTurnstileWidgets();

        document.getElementById('passwordResetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            var email = document.getElementById('resetEmail').value.trim();
            var resetBtn = document.getElementById('resetBtn');
            var resetError = document.getElementById('resetError');
            
            // Email validation
            var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                resetError.textContent = 'Geçerli bir e-posta adresi giriniz.';
                resetError.style.display = 'block';
                document.getElementById('resetEmail').classList.add('error');
                return;
            }

            if (isTurnstileEnabled()) {
                var turnstileToken = document.querySelector('#passwordResetForm [name="cf-turnstile-response"]');
                if (!turnstileToken || !turnstileToken.value) {
                    resetError.textContent = 'Lütfen robot olmadığını doğrulayın.';
                    resetError.style.display = 'block';
                    return;
                }
            }

            // Loading state
            resetBtn.classList.add('btn-loading');
            resetBtn.disabled = true;
            
            try {
                await sendPasswordReset(email);
                
                // Success
                document.getElementById('resetForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                
            } catch (err) {
                resetBtn.classList.remove('btn-loading');
                resetBtn.disabled = false;
                
                if (err.message && err.message.toLowerCase().indexOf('not found') !== -1) {
                    resetError.textContent = 'Bu e-posta adresi ile kayıtlı bir hesap bulunamadı.';
                } else {
                    resetError.textContent = 'Bir hata oluştu: ' + (err.message || 'Lütfen daha sonra tekrar deneyin.');
                }
                resetError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
