  </g>
  <text x="200" y="250" font-family="Poppins, Inter, Arial, sans-serif" font-size="40" font-weight="800" fill="#1e3a5f" text-anchor="middle" letter-spacing="2">4 0 4</text>
  <text x="200" y="282" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5a6b82" text-anchor="middle">Aradığın sayfa pusulada kayboldu</text>
