<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Pusula</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: #fff; }
        .container { text-align: center; padding: 2rem; }
        .code { font-size: 6rem; font-weight: 800; font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e63946, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { opacity: 0.7; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 12px 32px; background: #e63946; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600; transition: background 0.3s; }
        .btn:hover { background: #c1121f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.</p>
        <a href="/" class="btn">Ana Sayfaya Dön</a>
    </div>
</body>
</html>
