name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: .env sızıntı kontrolü
        run: |
          if git ls-files | grep -E '\.env$' ; then echo ".env committed!"; exit 1; fi

      - name: npm audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
